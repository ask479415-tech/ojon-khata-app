<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Scale Balance Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Central Pillar -->
    <rect x="244" y="140" width="24" height="230" rx="12" fill="#ffffff"/>
    <ellipse cx="256" cy="140" rx="30" ry="24" fill="url(#gold)"/>
    
    <!-- Base -->
    <path d="M 170 370 Q 256 345 342 370 L 370 410 L 142 410 Z" fill="#ffffff"/>
    <rect x="180" y="410" width="152" height="16" rx="8" fill="url(#gold)"/>

    <!-- Beam -->
    <rect x="96" y="160" width="320" height="18" rx="9" fill="url(#gold)"/>

    <!-- Left Pan -->
    <line x1="120" y1="175" x2="80" y2="280" stroke="#ffffff" stroke-width="6"/>
    <line x1="120" y1="175" x2="160" y2="280" stroke="#ffffff" stroke-width="6"/>
    <path d="M 60 280 Q 120 330 180 280 Z" fill="url(#gold)"/>

    <!-- Right Pan -->
    <line x1="392" y1="175" x2="352" y2="280" stroke="#ffffff" stroke-width="6"/>
    <line x1="392" y1="175" x2="432" y2="280" stroke="#ffffff" stroke-width="6"/>
    <path d="M 332 280 Q 392 330 452 280 Z" fill="url(#gold)"/>

    <!-- Weight Stone on Right Pan -->
    <rect x="372" y="245" width="40" height="35" rx="6" fill="#ffffff"/>
    <text x="392" y="268" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">KG</text>
  </g>

  <!-- Text Badge -->
  <rect x="156" y="435" width="200" height="42" rx="21" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="256" y="463" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ওজন খাতা</text>
</svg>
